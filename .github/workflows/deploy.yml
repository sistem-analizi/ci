name: Build & Deploy to FTP

on:
  workflow_call:
    inputs:
      build_type:
        description: 'node | php | static'
        required: true
        type: string
      year:
        description: '4-digit year, e.g. 2026'
        required: true
        type: string
      project_slug:
        description: 'Project folder name. Defaults to repository name.'
        required: false
        type: string
        default: ''
      subdir:
        description: 'Optional sub-path appended after year/slug'
        required: false
        type: string
        default: ''
      build_command:
        description: 'Override default build command (node/php only)'
        required: false
        type: string
        default: ''
      output_dir:
        description: 'Override local output directory (e.g. dist, out, .output/public)'
        required: false
        type: string
        default: ''
      node_version:
        required: false
        type: string
        default: '20'
      php_version:
        required: false
        type: string
        default: '8.2'
      clean_slate:
        description: 'Wipe target dir before upload. Requires at least year/slug depth.'
        required: false
        type: boolean
        default: false
      build_env:
        description: 'Extra non-secret env vars (KEY=VALUE per line). Literal values only — do not interpolate secrets here.'
        required: false
        type: string
        default: ''
      forward_secrets:
        description: 'Comma-separated secret names to forward from caller into build env. Caller must use secrets:inherit.'
        required: false
        type: string
        default: ''
      exclude:
        description: 'Filename/dirname patterns to remove before FTP upload (one per line). Patterns match basenames; recursively removed from local-dir.'
        required: false
        type: string
        default: ''
      post_deploy_hook_url:
        description: 'URL to GET after successful FTP deploy. Hook key passed via ?key=... using DEPLOY_HOOK_KEY env var (set via forward_secrets).'
        required: false
        type: string
        default: ''
    secrets:
      FTP_URI:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── 1. Validate inputs & compute relative path ──────────────────────────
      - name: Validate inputs & compute path
        id: path
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          YEAR:       ${{ inputs.year }}
          SLUG:       ${{ inputs.project_slug }}
          SUB:        ${{ inputs.subdir }}
          REPO:       ${{ github.event.repository.name }}
        run: |
          python3 <<'EOF'
          import os, re, sys

          bt = os.environ["BUILD_TYPE"].strip().lower()
          if bt not in ("node", "php", "static"):
              print(f"::error::build_type must be node|php|static, got: {bt}")
              sys.exit(1)

          year = os.environ["YEAR"].strip()
          if not re.fullmatch(r"\d{4}", year):
              print(f"::error::year must be exactly 4 digits, got: {year}")
              sys.exit(1)

          slug = (os.environ["SLUG"].strip() or os.environ["REPO"].strip())
          if not re.fullmatch(r"[A-Za-z0-9._-]{2,64}", slug):
              print(f"::error::project_slug invalid (2-64 chars of [A-Za-z0-9._-]): {slug}")
              sys.exit(1)

          sub = os.environ["SUB"].strip().strip("/")
          if sub:
              if not re.fullmatch(r"[A-Za-z0-9._/-]{1,128}", sub):
                  print(f"::error::subdir invalid: {sub}")
                  sys.exit(1)
              for seg in sub.split("/"):
                  if seg in ("", ".", ".."):
                      print(f"::error::subdir contains forbidden segment: {sub}")
                      sys.exit(1)

          rel = f"{year}/{slug}" + (f"/{sub}" if sub else "")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"rel={rel}\n")
          print(f"Computed deploy path (relative): {rel}")
          EOF

      # ── 2. Safety check for clean_slate ─────────────────────────────────────
      - name: Safety check for clean_slate
        if: ${{ inputs.clean_slate }}
        env:
          REL: ${{ steps.path.outputs.rel }}
        run: |
          seg_count=$(echo "$REL" | tr '/' '\n' | grep -c .)
          if [ "$seg_count" -lt 2 ]; then
            echo "::error::clean_slate requires at least year/slug depth, got: $REL"
            exit 1
          fi
          if echo "$REL" | grep -Eq '^[0-9]{4}/?$'; then
            echo "::error::clean_slate forbidden on year-only path: $REL"
            exit 1
          fi

      # ── 3a. Node build ──────────────────────────────────────────────────────
      - name: Detect package manager
        if: inputs.build_type == 'node'
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: inputs.build_type == 'node' && steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: inputs.build_type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.pm.outputs.pm }}

      - name: Apply caller build env (non-secret)
        if: (inputs.build_type == 'node' || inputs.build_type == 'php') && inputs.build_env != ''
        env:
          BUILD_ENV: ${{ inputs.build_env }}
        run: |
          echo "Applying caller-provided non-secret env vars:"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in '#'*) continue ;; esac
            key="${line%%=*}"
            echo "  -> $key"
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$BUILD_ENV"

      - name: Forward inherited secrets to build env
        if: (inputs.build_type == 'node' || inputs.build_type == 'php') && inputs.forward_secrets != ''
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          NAMES:        ${{ inputs.forward_secrets }}
        run: |
          echo "Forwarding secrets to build env (values masked):"
          IFS=',' read -ra ARR <<< "$NAMES"
          for raw in "${ARR[@]}"; do
            name="$(echo "$raw" | xargs)"
            [ -z "$name" ] && continue
            val="$(jq -r --arg n "$name" '.[$n] // empty' <<< "$SECRETS_JSON")"
            if [ -z "$val" ]; then
              echo "  -> $name (NOT FOUND — caller must define this secret)"
              continue
            fi

            # Mask: register whole value, then each line individually,
            # then each KEY=VALUE's value-part — but ONLY if the value looks
            # like a real secret (length >= 8 AND not a known common token).
            # Otherwise short values like "file" or "sync" from .env pollute
            # the global mask list and corrupt log output.
            should_mask() {
              local v="$1"
              [ ${#v} -lt 8 ] && return 1
              case "$v" in
                file|stack|null|log|sync|true|false|yes|no|on|off|smtp|tls|ssl|\
                mysql|sqlite|sqlite3|postgres|mailgun|ses|production|local|\
                staging|info|debug|warning|error|critical|emergency|notice|\
                Laravel|laravel|memory|redis|database|cookie|array)
                  return 1 ;;
              esac
              return 0
            }

            if should_mask "$val"; then
              printf '::add-mask::%s\n' "$val"
            fi
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in '#'*) continue ;; esac
              # Mask whole KEY=VALUE line only if value-part is real secret
              case "$line" in *=*)
                line_val="${line#*=}"
                line_val="${line_val#\"}"; line_val="${line_val%\"}"
                line_val="${line_val#\'}"; line_val="${line_val%\'}"
                if should_mask "$line_val"; then
                  printf '::add-mask::%s\n' "$line"
                  printf '::add-mask::%s\n' "$line_val"
                fi
                ;;
              esac
            done <<< "$val"

            # Multiline-safe write to GITHUB_ENV via heredoc delimiter
            {
              printf '%s<<__EOF_FWD__\n' "$name"
              printf '%s\n' "$val"
              printf '__EOF_FWD__\n'
            } >> "$GITHUB_ENV"
            echo "  -> $name (masked)"
          done

      - name: Install & build (node)
        if: inputs.build_type == 'node'
        env:
          CI: 'false'
          PUBLIC_URL:        /${{ steps.path.outputs.rel }}/
          BASE_URL:          /${{ steps.path.outputs.rel }}/
          NUXT_APP_BASE_URL: /${{ steps.path.outputs.rel }}/
          VITE_BASE_URL:     /${{ steps.path.outputs.rel }}/
          CUSTOM_CMD:        ${{ inputs.build_command }}
          PM:                ${{ steps.pm.outputs.pm }}
        run: |
          echo "Package manager: $PM"
          echo "PUBLIC_URL: $PUBLIC_URL"

          # Install
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm)
              if [ -f package-lock.json ]; then
                npm ci
              else
                npm install --no-audit --no-fund
              fi
              ;;
          esac

          # Build
          if [ -n "$CUSTOM_CMD" ]; then
            bash -c "$CUSTOM_CMD"
          else
            case "$PM" in
              pnpm) pnpm run build ;;
              yarn) yarn build ;;
              npm)  npm run build ;;
            esac
          fi

      # ── 3b. PHP build ───────────────────────────────────────────────────────
      - name: Setup PHP
        if: inputs.build_type == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}

      - name: Composer install (php)
        if: inputs.build_type == 'php'
        env:
          CUSTOM_CMD: ${{ inputs.build_command }}
        run: |
          if [ -f composer.json ]; then
            composer install --no-dev --optimize-autoloader
          fi
          if [ -n "$CUSTOM_CMD" ]; then
            bash -c "$CUSTOM_CMD"
          fi

      # ── 3c. Static: nothing to build ────────────────────────────────────────

      # ── 4. Resolve local output directory ───────────────────────────────────
      - name: Resolve local dir
        id: localdir
        env:
          OVERRIDE:   ${{ inputs.output_dir }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            dir="${OVERRIDE%/}/"
          else
            case "$BUILD_TYPE" in
              node)   dir="./build/" ;;
              php)    dir="./" ;;
              static) dir="./" ;;
            esac
          fi
          if [ ! -d "$dir" ]; then
            echo "::error::Output directory not found: $dir"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Local dir to upload: $dir"

      # ── 5. Parse FTP_URI & merge with computed path ─────────────────────────
      - name: Parse FTP URI
        id: ftp
        env:
          FTP_URI: ${{ secrets.FTP_URI }}
          REL:     ${{ steps.path.outputs.rel }}
        run: |
          python3 <<'EOF'
          import os, urllib.parse, sys

          uri = os.environ["FTP_URI"].strip()
          if not uri:
              print("::error::FTP_URI secret is empty"); sys.exit(1)

          p = urllib.parse.urlparse(uri)
          scheme = (p.scheme or "ftp").lower()
          if scheme not in ("ftp", "ftps", "sftp"):
              print(f"::error::unsupported scheme: {scheme}"); sys.exit(1)

          host = p.hostname or ""
          if not host:
              print("::error::FTP_URI must include a host"); sys.exit(1)

          port = p.port or (22 if scheme == "sftp" else 21)
          user = urllib.parse.unquote(p.username or "")
          pwd  = urllib.parse.unquote(p.password or "")

          base = (p.path or "/").rstrip("/")
          rel  = os.environ["REL"].strip("/")
          full = f"{base}/{rel}/" if base else f"/{rel}/"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"server={host}\n")
              f.write(f"port={port}\n")
              f.write(f"protocol={scheme}\n")
              f.write(f"server_dir={full}\n")

          if user: print(f"::add-mask::{user}")
          if pwd:  print(f"::add-mask::{pwd}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"FTP_USER={user}\n")
              f.write(f"FTP_PASS={pwd}\n")

          print(f"Target: {scheme}://{host}:{port}{full}")
          EOF

      # ── 6. Deploy ───────────────────────────────────────────────────────────
      - name: Force IPv4 DNS for FTP host
        env:
          FTP_HOST: ${{ steps.ftp.outputs.server }}
        run: |
          # Many shared-hosting FTP servers are dual-stack but their IPv6 PASV
          # (EPSV) path is broken (ECONNRESET mid-transfer). GitHub runners
          # prefer IPv6 by default. Force IPv4-only resolution via /etc/hosts.
          IPV4="$(getent ahostsv4 "$FTP_HOST" 2>/dev/null | awk 'NR==1{print $1}')"
          if [ -z "$IPV4" ]; then
            echo "::warning::Could not resolve IPv4 for $FTP_HOST — proceeding with default DNS"
            exit 0
          fi
          printf '::add-mask::%s\n' "$IPV4"
          echo "$IPV4 $FTP_HOST" | sudo tee -a /etc/hosts > /dev/null
          echo "Pinned $FTP_HOST to IPv4 (avoids broken IPv6 EPSV on shared hosting)"

      - name: Prune local dir & build exclude list
        id: prune
        env:
          LOCAL_DIR:    ${{ steps.localdir.outputs.dir }}
          USER_EXCLUDE: ${{ inputs.exclude }}
        run: |
          # Two-level exclusion strategy:
          #
          # 1) DEFAULTS (.git, node_modules, etc.): physically removed from
          #    LOCAL_DIR. lftp never sees them; mirror --delete will clean any
          #    orphan copies on the remote (e.g. .git uploaded by old deploys).
          #
          # 2) USER patterns (*.db, *.log, etc.): physically removed from
          #    LOCAL_DIR AND passed to lftp --exclude-glob. The latter PROTECTS
          #    matching files on the remote from being deleted by mirror, which
          #    is what you want for runtime-created data (SQLite DBs, logs, etc).

          # NOT: .env intentionally NOT in defaults. If user commits .env to
          # repo, it gets deployed. Web access to .env is blocked by the FTP
          # root .htaccess (FilesMatch "^\."). Projects with real secrets in
          # .env should keep it in .gitignore and use forward_secrets or
          # generate .env in build_command (Laravel pattern).
          DEFAULTS=(
            ".git" ".github" ".gitignore" ".gitattributes" ".gitkeep"
            "node_modules"
            ".DS_Store" "Thumbs.db"
            ".vscode" ".idea"
          )

          # Parse user excludes — normalize FTP-Deploy-Action style globs
          USER_PATS=()
          if [ -n "$USER_EXCLUDE" ]; then
            while IFS= read -r pat; do
              pat="$(echo "$pat" | xargs)"
              [ -z "$pat" ] && continue
              case "$pat" in '#'*) continue ;; esac
              case "$pat" in '**/'*) pat="${pat#"**/"}" ;; esac
              case "$pat" in *'/**') pat="${pat%"/**"}" ;; esac
              USER_PATS+=( "$pat" )
            done <<< "$USER_EXCLUDE"
          fi

          ALL=( "${DEFAULTS[@]}" "${USER_PATS[@]}" )
          echo "Pruning patterns from $LOCAL_DIR:"
          printf "  - %s\n" "${ALL[@]}"

          for pat in "${ALL[@]}"; do
            find "$LOCAL_DIR" -mindepth 1 -name "$pat" -prune -exec rm -rf {} + 2>/dev/null || true
          done

          echo ""
          echo "Remaining top-level entries in $LOCAL_DIR:"
          ls -la "$LOCAL_DIR" | head -50

          # Output user patterns for lftp --exclude-glob (protect on remote).
          # Defaults are NOT in this list — orphan .git etc. should be deletable.
          {
            echo "preserve_globs<<__EOF_PG__"
            if [ "${#USER_PATS[@]}" -gt 0 ]; then
              printf '%s\n' "${USER_PATS[@]}"
            fi
            echo "__EOF_PG__"
          } >> "$GITHUB_OUTPUT"

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --version | head -1

      - name: Deploy via lftp
        env:
          FTP_HOST:       ${{ steps.ftp.outputs.server }}
          FTP_PORT:       ${{ steps.ftp.outputs.port }}
          FTP_PROTO:      ${{ steps.ftp.outputs.protocol }}
          FTP_DIR:        ${{ steps.ftp.outputs.server_dir }}
          LOCAL_DIR:      ${{ steps.localdir.outputs.dir }}
          CLEAN_SLATE:    ${{ inputs.clean_slate }}
          PRESERVE_GLOBS: ${{ steps.prune.outputs.preserve_globs }}
        run: |
          set -euo pipefail

          # SamKirkland/FTP-Deploy-Action uses basic-ftp which defaults to EPSV
          # for passive transfers. Many shared-hosting FTP servers (cPanel,
          # Plesk, etc.) advertise EPSV but actually drop the data connection
          # mid-transfer (ECONNRESET). lftp lets us force the older PASV
          # command which is universally compatible.

          # Resolve scheme for lftp URL
          case "$FTP_PROTO" in
            ftps) URL_SCHEME="ftps" ;;
            sftp) URL_SCHEME="sftp" ;;
            *)    URL_SCHEME="ftp" ;;
          esac

          echo "Deploying via lftp:"
          echo "  protocol  : $URL_SCHEME"
          echo "  host:port : $FTP_HOST:$FTP_PORT"
          echo "  local     : $LOCAL_DIR"
          echo "  remote    : $FTP_DIR"

          # Build the lftp command stream
          {
            # Network reliability tuning
            echo "set ftp:use-epsv no"
            echo "set ftp:passive-mode on"
            echo "set ftp:ssl-allow yes"
            echo "set ssl:verify-certificate no"
            echo "set sftp:auto-confirm yes"
            echo "set net:max-retries 3"
            echo "set net:reconnect-interval-base 5"
            echo "set net:reconnect-interval-multiplier 1"
            echo "set net:timeout 30"
            echo "set xfer:clobber on"
            echo "set cmd:fail-exit yes"

            # Connect
            printf "open -u '%s','%s' -p %s %s://%s\n" \
              "$FTP_USER" "$FTP_PASS" "$FTP_PORT" "$URL_SCHEME" "$FTP_HOST"

            # Make sure remote dir exists, then enter it
            printf "mkdir -fp %s\n" "$FTP_DIR"

            # Build mirror command incrementally
            printf "mirror --reverse --verbose"
            if [ "$CLEAN_SLATE" = "true" ]; then
              printf " --delete-first"
            else
              printf " --delete"
            fi
            # Parallel transfers: 5 = good balance. Higher risks shared-hosting
            # connection limits (typically 8-10 per IP). Helps significantly for
            # Laravel/CRA builds with thousands of small vendor/node_modules files.
            printf " --parallel=5"
            # PRESERVE_GLOBS protect runtime files (DBs, logs, etc.) on remote
            # from being deleted by mirror. Defaults like .git are intentionally
            # NOT in this list — we want orphan cleanup to happen.
            while IFS= read -r pat; do
              pat="$(echo "$pat" | xargs)"
              [ -z "$pat" ] && continue
              printf " --exclude-glob %s" "$pat"
            done <<< "$PRESERVE_GLOBS"
            printf " -- %s %s\n" "$LOCAL_DIR" "$FTP_DIR"

            echo "bye"
          } | lftp

          echo "Deploy completed successfully."

      - name: Trigger post-deploy hook
        if: inputs.post_deploy_hook_url != ''
        env:
          HOOK_URL: ${{ inputs.post_deploy_hook_url }}
          # HOOK_KEY is expected to be set via forward_secrets (e.g.
          # 'DEPLOY_HOOK_KEY' added to caller's GitHub secrets and listed
          # in forward_secrets). It arrives here as a plain env var.
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK_KEY:-}" ]; then
            echo "::error::post_deploy_hook_url is set but DEPLOY_HOOK_KEY env var missing. Add DEPLOY_HOOK_KEY to forward_secrets in caller workflow."
            exit 1
          fi
          echo "Triggering post-deploy hook..."

          HTTP_CODE=$(curl -sS --max-time 300 \
            -w "%{http_code}" \
            -o /tmp/hook-response.txt \
            "${HOOK_URL}?key=${DEPLOY_HOOK_KEY}" || echo "000")

          echo "─── Hook response ───"
          cat /tmp/hook-response.txt || true
          echo ""
          echo "─── HTTP $HTTP_CODE ───"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Deploy hook returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Hook completed successfully."
